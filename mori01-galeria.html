<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería de Bases · MORI-01</title>
<style>
  :root{
    --bg-deep:#07080d; --bg-panel:#0c0f1c; --bg-panel-2:#10142a;
    --border-soft:#232842; --border-bright:#3a4270;
    --text-primary:#e8eaf2; --text-muted:#8b93b3; --text-dim:#565d80;
    --accent-cyan:#06b6d4; --accent-gold:#f5b849; --accent-violet:#7c6cff;
    --font-display:"Eurostile","Michroma","Orbitron",system-ui,sans-serif;
    --font-body:"Titillium Web","Segoe UI",system-ui,sans-serif;
    --font-mono:"JetBrains Mono","Fira Code",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-deep); color:var(--text-primary); font-family:var(--font-body); line-height:1.5; min-height:100vh;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent-cyan); outline-offset:2px;}

  .wrap{max-width:1080px; margin:0 auto; padding:48px 24px 80px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); margin-bottom:28px;}
  .back-link:hover{color:var(--accent-cyan);}
  .top-eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; color:var(--accent-gold); text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:10px;}
  .top-eyebrow::before{content:""; width:20px; height:1px; background:var(--accent-gold); opacity:.6;}
  h1{font-family:var(--font-display); font-weight:400; font-size:clamp(30px,5vw,44px); letter-spacing:.03em; margin-bottom:12px;}
  .lede{color:var(--text-muted); font-size:15px; max-width:620px; margin-bottom:36px;}

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:20px;
    align-items:start;
  }
  .gallery-card{
    position:relative;
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    box-shadow:0 10px 40px -20px rgba(0,0,0,.6);
  }
  .gallery-card:hover{
    transform:translateY(-4px);
    border-color:var(--accent-cyan);
    box-shadow:0 20px 60px -20px rgba(6,182,212,.35);
  }
  .gallery-card .gimg{
    width:100%;
    aspect-ratio:4/5;
    background:var(--bg-panel-2);
    overflow:hidden;
    position:relative;
  }
  .gallery-card .gimg img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .35s ease;
  }
  .gallery-card:hover .gimg img{ transform:scale(1.05); }
  .gallery-card .ginfo{
    position:absolute;
    inset:auto 0 0 0;
    padding:14px 16px 16px;
    background:linear-gradient(to top, rgba(7,8,13,.96) 0%, rgba(7,8,13,.6) 60%, rgba(7,8,13,0) 100%);
    backdrop-filter:blur(4px) saturate(1.1);
    transform:translateY(8px);
    opacity:0;
    transition:transform .25s ease, opacity .25s ease;
  }
  .gallery-card:hover .ginfo{ transform:translateY(0); opacity:1; }
  .gallery-card .gname{font-weight:600; font-size:14px; margin-bottom:2px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gallery-card .gplanet{font-size:11.5px; color:var(--accent-cyan); font-family:var(--font-mono);}
  .gallery-card .gdesc{font-size:12px; color:var(--text-muted); margin-top:4px; line-height:1.4; max-height:2.8em; overflow:hidden;}
  .empty-state{color:var(--text-dim); font-size:13.5px; text-align:center; padding:60px 0; font-family:var(--font-mono);}

  .lightbox{
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(4,5,9,.92); backdrop-filter:blur(4px);
    align-items:center; justify-content:center; padding:32px;
    flex-direction:column; gap:16px;
  }
  .lightbox.show{display:flex;}
  .lightbox img{
    max-width:min(90vw, 900px); max-height:75vh; object-fit:contain;
    border-radius:8px; border:1px solid var(--border-bright);
    box-shadow:0 30px 70px -20px rgba(0,0,0,.8);
  }
  .lightbox-info{text-align:center;}
  .lightbox-info .gname{font-weight:600; font-size:16px;}
  .lightbox-info .gplanet{font-size:12.5px; color:var(--accent-cyan); font-family:var(--font-mono); margin-top:2px;}
  .lightbox-close{
    position:absolute; top:20px; right:24px; background:none; border:1px solid var(--border-bright);
    color:var(--text-primary); width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:18px;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .lightbox-close:hover{border-color:var(--accent-gold); color:var(--accent-gold);}
</style>
<link rel="stylesheet" href="./cosmos-theme.css">
</head>
<body>

<!-- Cosmos theme: decorative elements -->
<div class="cosmos-dust"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="cosmos-station">
  <img src="./cosmos-img/outpost-float.png" alt="">
</div>
<div class="cosmos-img cosmos-img--ice-asteroid"></div>
<div class="cosmos-img cosmos-img--datacore"></div>
<div class="cosmos-img cosmos-img--slime cosmos-img--slime-1"></div>
<div class="cosmos-img cosmos-img--slime cosmos-img--slime-3"></div>

<div class="cosmos-sd cosmos-sd--lg cosmos-sd--1" style="left:6%; top:42%;"></div>
<div class="cosmos-sd cosmos-sd--md cosmos-sd--2" style="right:12%; bottom:6%;"></div>
<div class="cosmos-sd cosmos-sd--sm cosmos-sd--3" style="left:58%; top:60%;"></div>
<div class="wrap">

  <a class="back-link" href="./index.html" id="backLink">← Volver</a>
  <p class="top-eyebrow">Galería de la comunidad</p>
  <h1>Ciudadanos y sus bases</h1>
  <p class="lede">Fotos de las bases de la comunidad, aprobadas por el Arcade. Haz clic en cualquiera para verla en grande. ¿Quieres subir la tuya? Ve a "Mi Tarjeta de Ciudadano" y busca tu base por su ID.</p>

  <div id="galleryGrid" class="gallery-grid"></div>

</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-info">
    <div class="gname" id="lightboxName"></div>
    <div class="gplanet" id="lightboxPlanet"></div>
  </div>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { PLANETS, SYSTEM_INFO } from './mori01-data.js';
  import { collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  document.getElementById('backLink').textContent = `← Volver a ${SYSTEM_INFO.shortName}`;

  const citizensCol = collection(db, 'citizens');
  const basesCol = collection(db, 'citizenBases');
  const galleryCol = collection(db, 'gallery');

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s ?? '';
    return d.innerHTML;
  }

  const citizensCol = collection(db, 'citizens');
  const basesCol = collection(db, 'citizenBases');
  const galleryCol = collection(db, 'gallery');

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s ?? '';
    return d.innerHTML;
  }

  function openLightbox(photoUrl, name, planetName){
    lightboxImg.src = photoUrl;
    lightboxImg.alt = 'Imagen ' + name;
    lightboxName.textContent = name;
    lightboxPlanet.textContent = planetName;
    lightbox.classList.add('show');
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    lightboxImg.src = '';
  }

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxName = document.getElementById('lightboxName');
  const lightboxPlanet = document.getElementById('lightboxPlanet');

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e=>{ if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeLightbox(); });

  function renderGallery(entries){
    const grid = document.getElementById('galleryGrid');
    if(!entries.length){
      grid.innerHTML = '<div class="empty-state">Todavía no hay fotos aprobadas. ¡Sube la tuya desde tu Tarjeta de Ciudadano o desde el Admin!</div>';
      return;
    }
    const sorted = [...entries].sort((a,b)=>{
      const ta = b.ts?.toMillis ? b.ts.toMillis() : (b.ts||0);
      const tb = a.ts?.toMillis ? a.ts.toMillis() : (a.ts||0);
      if(ta !== tb) return ta - tb;
      return 0;
    });
    grid.innerHTML = sorted.map((e,i)=>{
      const planet = PLANETS.find(p=>p.i===e.planetIndex);
      const name = e.title || e.name || 'Sin título';
      const desc = e.description ? '<div class="gdesc">'+escapeHtml(e.description)+'</div>' : '';
      const planetName = e.planetName || (planet ? planet.name : (e.planetIndex===undefined?'—':'—'));
      const url = e.photoUrl || e.url;
      return '<div class="gallery-card" data-idx="'+i+'"><div class="gimg"><img src="'+url+'" alt="'+escapeHtml(name)+'" loading="lazy"></div><div class="ginfo"><div class="gname">'+escapeHtml(name)+'</div>'+(planetName?' <div class="gplanet">'+escapeHtml(planetName)+'</div>':'')+desc+'</div></div>';
    }).join('');

    grid.querySelectorAll('.gallery-card').forEach(card=>{
      const e = sorted[parseInt(card.dataset.idx, 10)];
      const planet = PLANETS.find(p=>p.i===e.planetIndex);
      const name = e.title || e.name || 'Sin título';
      const planetName = e.planetName || (planet ? planet.name : '—');
      const url = e.photoUrl || e.url;
      card.addEventListener('click', ()=> openLightbox(url, name, planetName));
    });
  }

  let citizenPhotos = [];
  let basePhotos = [];
  let galleryPhotos = [];

  function repaint(){
    renderGallery([...citizenPhotos, ...basePhotos, ...galleryPhotos]);
  }

  const q1 = query(citizensCol, where('photoStatus', '==', 'approved'), orderBy('ts', 'desc'));
  onSnapshot(q1, snap=>{
    citizenPhotos = snap.docs.map(d=>({ docId: d.id, ...d.data() })).filter(e=>e.photoUrl);
    repaint();
  }, err=>{
    document.getElementById('galleryGrid').innerHTML = '<div class="empty-state">No se pudo cargar la galería. Revisa las reglas o el índice de Firestore.</div>';
  });

  const q2 = query(basesCol, where('photoStatus', '==', 'approved'), orderBy('ts', 'desc'));
  onSnapshot(q2, snap=>{
    basePhotos = snap.docs.map(d=>({ docId: d.id, ...d.data() })).filter(e=>e.photoUrl);
    repaint();
  }, err=>{
    console.warn('No se pudieron cargar las fotos de bases adicionales', err);
  });

  onSnapshot(query(galleryCol, orderBy('ts','desc')), snap=>{
    galleryPhotos = snap.docs.map(d=>({ docId:d.id, ...d.data(), photoUrl: d.data().url }));
    repaint();
  }, err=>{
    console.warn('No se pudieron cargar la galería subida desde Admin', err);
  });
</script>
</body>
</html>
