<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Atlas Galáctico - Agrupamiento de Sistemas</title>
    <style>
        body { margin: 0; background-color: #050510; color: #fff; font-family: sans-serif; overflow: hidden; }
        #ui-container { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(10, 10, 30, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #3a3a8a; width: 320px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; background: #1a1a3a; border: 1px solid #5a5a9a; color: white; border-radius: 4px; }
        button { background: #3a3a9a; cursor: pointer; font-weight: bold; }
        button:hover { background: #5a5aha; }
        
        /* Contenedor de la lista de sistemas */
        #lista-sistemas { max-height: 300px; overflow-y: auto; font-size: 13px; margin-top: 15px; padding: 0; list-style: none; }
        .sistema-card { background: rgba(25px, 25px, 60px, 0.4); margin-bottom: 8px; padding: 10px; border-left: 4px solid #00ffff; border-radius: 0 4px 4px 0; }
        .base-item { font-size: 11px; color: #aaa; margin-left: 10px; padding: 2px 0; border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
    <!-- Librerías de renderizado 3D -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-container">
        <h3>🌌 Atlas Galáctico (Clustering)</h3>
        <label for="glyph-input">Código de Glifos (12 dígitos Hex):</label>
        <input type="text" id="glyph-input" placeholder="Ej: 10A1FF7FF7FF" maxlength="12" value="10A1FF7FF7FF">
        <input type="text" id="base-name" placeholder="Nombre de la Base (Opcional)" maxlength="20">
        <button onclick="registrarUbicacion()">Registrar en el Atlas</button>
        
        <h4>📍 Sistemas en esta Región:</h4>
        <div id="lista-sistemas"></div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN DE LA ESCENA 3D ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 400, 800);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Iluminación
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));

        // Centro Galáctico (Referencia)
        const centroGalaxia = new THREE.Mesh(
            new THREE.SphereGeometry(12, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true })
        );
        scene.add(centroGalaxia);

        // --- 2. ESTRUCTURA DE DATOS (NÚCLEO DEL CLUSTERING) ---
        // Aquí guardaremos los sistemas usando sus coordenadas como Llave Única para evitar duplicados
        const mapaSistemas = {}; 

        // Algoritmo puro de conversión de No Man's Sky (Posición del Sistema)
        function decodificarPosicionSistema(hexStr) {
            if (hexStr.length !== 12) return null;
            
            const pVal = parseInt(hexStr[0], 16);             // Índice de Planeta
            const sssVal = parseInt(hexStr.slice(1, 4), 16);   // ID Sistema
            const yVal = parseInt(hexStr.slice(4, 6), 16);     // Altura (Y)
            const zVal = parseInt(hexStr.slice(6, 9), 16);     // Profundidad (Z)
            const xVal = parseInt(hexStr.slice(9, 12), 16);    // Horizontal (X)

            // Conversión matemática con Offsets oficiales del juego
            const x = xVal - 0x7FF;
            const y = yVal - 0x7F;
            const z = zVal - 0x7FF;

            // Generamos una llave única para el sistema basada estrictamente en sus coordenadas de estrella
            const llaveSistema = `${x}_${y}_${z}`;

            return { x, y, z, planeta: pVal, sistemaId: sssVal, llave: llaveSistema };
        }

        // --- 3. LOGICA DE REGISTRO Y AGRUPAMIENTO ---
        function registrarUbicacion() {
            const glyphInput = document.getElementById('glyph-input').value.trim().toUpperCase();
            let baseName = document.getElementById('base-name').value.trim();

            if (!/^[0-9A-F]{12}$/.test(glyphInput)) {
                alert("Introduce un código hexadecimal válido de 12 dígitos.");
                return;
            }

            if (!baseName) baseName = `Base Planeta ${glyphInput[0]}`;

            const info = decodificarPosicionSistema(glyphInput);
            if (!info) return;

            // COMPROBACIÓN DE COLISIÓN (Clustering)
            if (mapaSistemas[info.llave]) {
                // El sistema ya existe en el mapa 3D, añadimos la nueva base a su lista interna
                mapaSistemas[info.llave].bases.push({ nombre: baseName, glifo: glyphInput });
                
                // Efecto Visual: Hacemos crecer la estrella del mapa al recibir más bases registradas
                const mesh = mapaSistemas[info.llave].mesh;
                const factorEscala = 1 + (mapaSistemas[info.llave].bases.length * 0.25);
                mesh.scale.set(factorEscala, factorEscala, factorEscala);
                
                // Cambiar el color a uno más brillante/importante (ej: dorado) si tiene muchas bases
                mesh.material.color.setHex(0xff00ff); 
            } else {
                // El sistema es totalmente nuevo, lo creamos desde cero
                const estrellaGeo = new THREE.SphereGeometry(6, 16, 16);
                const estrellaMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                const estrellaMesh = new THREE.Mesh(estrellaGeo, estrellaMat);
                
                estrellaMesh.position.set(info.x, info.y, info.z);
                scene.add(estrellaMesh);

                // Línea de profundidad hacia el plano cero
                const points = [new THREE.Vector3(info.x, 0, info.z), new THREE.Vector3(info.x, info.y, info.z)];
                const linea = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints(points),
                    new THREE.LineBasicMaterial({ color: 0x222244 })
                );
                scene.add(linea);

                // Guardamos el objeto completo en nuestro diccionario
                mapaSistemas[info.llave] = {
                    x: info.x, y: info.y, z: info.z,
                    sistemaId: info.sistemaId,
                    mesh: estrellaMesh,
                    bases: [{ nombre: baseName, glifo: glyphInput }]
                };
            }

            // Limpiar inputs y refrescar la interfaz lateral
            document.getElementById('base-name').value = "";
            actualizarInterfazHTML();
        }

        // --- 4. RENDERIZADO DE LA INTERFAZ DE USUARIO (UI) ---
        function actualizarInterfazHTML() {
            const contenedor = document.getElementById('lista-sistemas');
            contenedor.innerHTML = ""; // Limpiar lista previa

            // Recorrer nuestro diccionario de sistemas agrupados
            for (const llave in mapaSistemas) {
                const sys = mapaSistemas[llave];
                
                const card = document.createElement('div');
                card.className = "sistema-card";
                card.innerHTML = `
                    <b>✨ Sistema Decodificado (ID: ${sys.sistemaId})</b><br>
                    <small>Coords Galácticas: [${sys.x}, ${sys.y}, ${sys.z}]</small><br>
                    <strong>Bases Registradas (${sys.bases.length}):</strong>
                `;

                // Añadir cada una de las bases que colisionaron en este mismo sistema estelar
                sys.bases.forEach(base => {
                    const baseDiv = document.createElement('div');
                    baseDiv.className = "base-item";
                    baseDiv.innerHTML = `🏠 <b>${base.nombre}</b> — <code>${base.glifo}</code>`;
                    card.appendChild(baseDiv);
                });

                contenedor.appendChild(card);
            }
        }

        // --- 5. BUCLE DE ANIMACIÓN DEL MAPA 3D ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
