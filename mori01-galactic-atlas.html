<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galactic Atlas · MORI-01</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');

  :root {
    --bg-deep:#07080d; --bg-panel:#0c0f1c; --bg-panel-2:#10142a;
    --border-soft:#232842; --border-bright:#3a4270;
    --text-primary:#e8eaf2; --text-muted:#8b93b3; --text-dim:#565d80;
    --accent-cyan:#06b6d4; --accent-gold:#f5b849; --accent-violet:#7c6cff;
    --accent-red:#e8546b; --accent-green:#3ddc97;
    --font-display:"Eurostile","Michroma","Orbitron",system-ui,sans-serif;
    --font-body:"Titillium Web","Segoe UI",system-ui,sans-serif;
    --font-mono:"JetBrains Mono","Fira Code",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-deep); color:var(--text-primary); font-family:var(--font-body); line-height:1.5; min-height:100vh;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent-cyan); outline-offset:2px;}

  .wrap{max-width:1180px; margin:0 auto; padding:44px 24px 80px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); margin-bottom:24px; text-decoration:none;}
  .back-link:hover{color:var(--accent-cyan);}
  .top-eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; color:var(--accent-gold); text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:10px;}
  .top-eyebrow::before{content:""; width:20px; height:1px; background:var(--accent-gold); opacity:.6;}
  h1{font-family:var(--font-display); font-weight:400; font-size:clamp(28px,5vw,42px); letter-spacing:.03em; margin-bottom:12px;}
  .lede{color:var(--text-muted); font-size:15px; max-width:660px; margin-bottom:32px;}

  .grid2{display:grid; grid-template-columns:1.4fr 1fr; gap:18px; margin-bottom:18px;}
  @media(max-width:900px){ .grid2{grid-template-columns:1fr;} }

  .panel{background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:8px; padding:22px; margin-bottom:18px;}
  .panel-label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.18em; color:var(--accent-gold);
    text-transform:uppercase; margin-bottom:16px; display:flex; align-items:center; gap:8px;
  }
  .panel-label::before{content:""; width:7px; height:7px; border:1px solid var(--accent-gold); transform:rotate(45deg); flex-shrink:0;}

  .galaxy-map{
    position:relative; width:100%; aspect-ratio:16/7; background:var(--bg-deep);
    border-radius:6px; overflow:hidden; border:1px solid var(--border-soft);
  }
  .galaxy-map canvas{width:100%; height:100%; display:block;}
  .map-coords-display{
    position:absolute; bottom:12px; left:12px; font-family:var(--font-mono); font-size:11px;
    color:var(--accent-cyan); background:rgba(7,8,13,.8); padding:6px 12px;
    border:1px solid var(--border-soft); border-radius:4px;
  }
  .map-legend{
    position:absolute; top:12px; right:12px; font-family:var(--font-mono); font-size:10.5px;
    color:var(--text-muted); background:rgba(7,8,13,.8); padding:8px 12px;
    border:1px solid var(--border-soft); border-radius:4px;
  }
  .map-legend-item{display:flex; align-items:center; gap:6px; margin-bottom:4px;}
  .map-legend-item:last-child{margin-bottom:0;}
  .legend-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}

  .data-row{display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--border-soft);}
  .data-row:last-child{border-bottom:none;}
  .data-key{font-size:12.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em;}
  .data-value{font-family:var(--font-mono); font-size:13px; color:var(--text-primary); text-align:right;}
  .data-value.cyan{color:var(--accent-cyan);}
  .data-value.gold{color:var(--accent-gold);}
  .data-value.green{color:var(--accent-green);}

  .signature-label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.18em; color:var(--text-dim);
    text-transform:uppercase; margin-bottom:16px; display:flex; justify-content:space-between;
  }
  .signature-label span:last-child{color:var(--accent-cyan);}
  .glyph-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .glyph{
    width:44px; height:44px; border:1px solid var(--border-bright); border-radius:4px;
    display:flex; align-items:center; justify-content:center; background:var(--bg-panel-2);
    position:relative;
  }
  .glyph img{width:26px; height:26px; object-fit:contain;}
  .glyph::after{
    content:attr(data-index); position:absolute; bottom:-15px; font-family:var(--font-mono);
    font-size:9px; color:var(--text-dim);
  }

  .planet-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:4px;}
  @media(max-width:560px){ .planet-grid{grid-template-columns:repeat(2, 1fr);} }
  .planet-card{
    background:var(--bg-panel-2); border:1px solid var(--border-soft); border-radius:6px;
    padding:12px; text-align:center; cursor:pointer; transition:border-color .2s, transform .2s;
  }
  .planet-card:hover, .planet-card.active{border-color:var(--accent-cyan); transform:translateY(-2px);}
  .planet-card-img{width:52px; height:52px; border-radius:50%; margin:0 auto 8px; overflow:hidden; background:var(--bg-panel);}
  .planet-card-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .planet-card-name{font-family:var(--font-display); font-size:12px; letter-spacing:.02em; margin-bottom:2px;}
  .planet-card-climate{font-family:var(--font-mono); font-size:10px; color:var(--text-muted);}

  .planet-detail{display:none; margin-top:16px; padding:16px; background:var(--bg-panel-2); border:1px solid var(--border-soft); border-radius:6px;}
  .planet-detail.visible{display:block;}
  .planet-detail-header{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .planet-detail-img{width:64px; height:64px; border-radius:50%; overflow:hidden; border:2px solid var(--accent-gold); flex-shrink:0;}
  .planet-detail-img img{width:100%; height:100%; object-fit:cover;}
  .planet-detail-name{font-family:var(--font-display); font-size:17px; letter-spacing:.02em;}
  .planet-detail-type{font-family:var(--font-mono); font-size:11px; color:var(--accent-cyan); margin-top:3px;}
  .planet-stats{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .planet-stat{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px;}
  .planet-stat-key{color:var(--text-muted); text-transform:uppercase; font-size:11px;}
  .planet-stat-val{font-family:var(--font-mono); font-size:12px;}
  .planet-resources{margin-top:12px; display:flex; flex-wrap:wrap; gap:6px;}
  .resource-chip{
    font-family:var(--font-mono); font-size:10.5px; padding:3px 8px;
    background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:3px; color:var(--text-muted);
  }

  .bases-list{max-height:520px; overflow-y:auto;}
  .base-card{
    display:flex; align-items:center; gap:14px; padding:14px; background:var(--bg-panel-2);
    border:1px solid var(--border-soft); border-radius:6px; margin-bottom:10px; transition:border-color .2s;
  }
  .base-card:hover{border-color:var(--accent-cyan);}
  .base-avatar{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(145deg, var(--accent-cyan), var(--accent-violet));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:16px; color:var(--bg-deep);
    overflow:hidden;
  }
  .base-avatar img{width:100%; height:100%; object-fit:cover;}
  .base-info{flex:1; min-width:0;}
  .base-info h3{font-family:var(--font-display); font-size:14.5px; font-weight:400; margin-bottom:3px;}
  .base-info p{font-size:12px; color:var(--text-muted); font-family:var(--font-mono); margin-top:2px;}
  .base-info .highlight{color:var(--accent-cyan);}
  .base-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .base-tag{
    font-family:var(--font-mono); font-size:10px; padding:2px 8px; border-radius:20px;
    background:var(--bg-panel); border:1px solid var(--border-soft); color:var(--text-muted);
  }
  .base-tag.role{border-color:rgba(124,108,255,.4); color:var(--accent-violet);}

  .status-dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; background:var(--accent-green);}
  .no-bases{text-align:center; padding:40px 0; color:var(--text-dim); font-family:var(--font-mono); font-size:13px;}
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="./index.html" id="backLink">← Volver</a>
  <p class="top-eyebrow">Guía de comunidad</p>
  <h1>Atlas Galáctico</h1>
  <p class="lede" id="lede">Vista general del sistema, sus mundos y las bases activas de la comunidad.</p>

  <div class="panel">
    <div class="panel-label">Mapa Galáctico</div>
    <div class="galaxy-map">
      <canvas id="galaxyCanvas"></canvas>
      <div class="map-coords-display" id="mapCoords"></div>
      <div class="map-legend">
        <div class="map-legend-item"><div class="legend-dot" style="background:var(--accent-cyan)"></div><span id="legendSystem"></span></div>
        <div class="map-legend-item"><div class="legend-dot" style="background:var(--accent-gold)"></div><span id="legendRegion"></span></div>
      </div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="panel-label">Cuerpos Celestes</div>
      <div class="planet-grid" id="planetGrid"></div>
      <div class="planet-detail" id="planetDetail"></div>
    </div>
    <div class="panel">
      <div class="panel-label">Datos del Sistema</div>
      <div id="systemDataRows"></div>
      <div class="data-row">
        <span class="data-key">Bases registradas</span>
        <span class="data-value gold" id="totalBases">0</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="signature-label"><span>Firma del sistema · Dirección de portal compartida</span><span id="signatureCount">—</span></div>
    <div class="glyph-row" id="portalCode"></div>
  </div>

  <div class="panel">
    <div class="panel-label">Bases de la Comunidad</div>
    <div class="bases-list" id="basesList"></div>
  </div>

</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { PLANETS, SYSTEM_INFO, SYSTEM_SIGNATURE, glyphSVG, planetImg } from './mori01-data.js';
  import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  document.getElementById('backLink').textContent = `← Volver a ${SYSTEM_INFO.shortName}`;
  document.title = `Atlas Galáctico · ${SYSTEM_INFO.shortName}`;
  document.getElementById('lede').textContent =
    `Vista general de ${SYSTEM_INFO.shortName}, sus mundos y las bases activas de la comunidad.`;

  let BASES = [];

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s ?? '';
    return d.innerHTML;
  }

  document.getElementById('legendSystem').textContent = SYSTEM_INFO.shortName;
  document.getElementById('legendRegion').textContent = SYSTEM_INFO.region;
  document.getElementById('mapCoords').textContent = SYSTEM_SIGNATURE.join('-');
  document.getElementById('signatureCount').textContent = `${SYSTEM_SIGNATURE.length} glifos`;

  document.getElementById('systemDataRows').innerHTML = [
    ['Galaxia', SYSTEM_INFO.galaxy, 'cyan'],
    ['Región', SYSTEM_INFO.region, ''],
    ['Raza', SYSTEM_INFO.race, 'green'],
    ['Economía', SYSTEM_INFO.economy, ''],
    ['Conflicto', SYSTEM_INFO.conflict, 'gold'],
  ].map(([key, val, cls]) => `
    <div class="data-row">
      <span class="data-key">${key}</span>
      <span class="data-value ${cls}">${val}</span>
    </div>
  `).join('');

  document.getElementById('portalCode').innerHTML = SYSTEM_SIGNATURE.map((n, i) => `
    <div class="glyph" data-index="${i + 1}" title="Glifo ${n}">${glyphSVG(n)}</div>
  `).join('');

  let selectedPlanetIdx = null;

  function renderPlanets(){
    const grid = document.getElementById('planetGrid');
    grid.innerHTML = PLANETS.map((p, idx) => `
      <div class="planet-card ${p.capital ? 'active' : ''}" data-idx="${idx}">
        <div class="planet-card-img">${planetImg(p)}</div>
        <div class="planet-card-name">${p.name}</div>
        <div class="planet-card-climate">${p.clima}</div>
      </div>
    `).join('');

    grid.querySelectorAll('.planet-card').forEach(card => {
      card.addEventListener('click', () => selectPlanet(parseInt(card.dataset.idx, 10)));
    });

    const capitalIdx = PLANETS.findIndex(p => p.capital);
    selectPlanet(capitalIdx >= 0 ? capitalIdx : 0);
  }

  function selectPlanet(idx){
    const p = PLANETS[idx];
    selectedPlanetIdx = idx;
    document.querySelectorAll('.planet-card').forEach((card, i) => card.classList.toggle('active', i === idx));

    const planetBases = BASES.filter(b => b.planetIndex === p.i);
    const detail = document.getElementById('planetDetail');
    detail.classList.add('visible');
    detail.innerHTML = `
      <div class="planet-detail-header">
        <div class="planet-detail-img">${planetImg(p)}</div>
        <div>
          <div class="planet-detail-name">${p.name}${p.capital ? ' ★' : ''}</div>
          <div class="planet-detail-type">${p.capital ? 'Capital · ' : ''}Glifo ${p.i}</div>
        </div>
      </div>
      <div class="planet-stats">
        <div class="planet-stat"><span class="planet-stat-key">Clima</span><span class="planet-stat-val">${p.clima}</span></div>
        <div class="planet-stat"><span class="planet-stat-key">Centinela</span><span class="planet-stat-val">${p.centinela}</span></div>
        <div class="planet-stat"><span class="planet-stat-key">Flora</span><span class="planet-stat-val">${p.flora}</span></div>
        <div class="planet-stat"><span class="planet-stat-key">Fauna</span><span class="planet-stat-val">${p.fauna}</span></div>
        <div class="planet-stat"><span class="planet-stat-key">Bases</span><span class="planet-stat-val" style="color:var(--accent-gold)">${planetBases.length}</span></div>
      </div>
      <div class="planet-resources">${p.rec.map(r => `<span class="resource-chip">${r}</span>`).join('')}</div>
    `;
  }

  function renderBases(){
    const container = document.getElementById('basesList');
    document.getElementById('totalBases').textContent = BASES.length;

    if(!BASES.length){
      container.innerHTML = '<div class="no-bases">No hay bases aprobadas aún.</div>';
      return;
    }

    container.innerHTML = BASES.map(base => {
      const planet = PLANETS.find(p => p.i === base.planetIndex);
      const planetName = planet ? planet.name : '—';
      const initials = (base.name || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
      const tags = [
        base.role ? `<span class="base-tag role">${escapeHtml(base.role)}</span>` : '',
        base.profession ? `<span class="base-tag">${escapeHtml(base.profession)}</span>` : '',
        base.platform ? `<span class="base-tag">${escapeHtml(base.platform)}</span>` : '',
      ].join('');

      const avatarContent = base.photoUrl
        ? `<img src="${escapeHtml(base.photoUrl)}" alt="${escapeHtml(base.name || '')}">`
        : initials;

      return `
        <div class="base-card">
          <div class="base-avatar">${avatarContent}</div>
          <div class="base-info">
            <h3>${escapeHtml(base.name || 'Sin nombre')}</h3>
            <p><span class="status-dot"></span>${base.id}</p>
            <p>Planeta: <span class="highlight">${planetName}</span> · Coords: <span class="highlight">${base.lat}, ${base.lon}</span></p>
            <div class="base-tags">${tags}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  let starsCache = null;

  function drawGalaxyMap(){
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();

    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2, 2);

    const w = rect.width, h = rect.height;

    ctx.fillStyle = '#07080d';
    ctx.fillRect(0, 0, w, h);

    if(!starsCache || starsCache.w !== w || starsCache.h !== h){
      starsCache = { w, h, dots: [] };
      for(let i = 0; i < 300; i++){
        starsCache.dots.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.2, a: Math.random()*0.6+0.1 });
      }
    }
    starsCache.dots.forEach(s => {
      ctx.fillStyle = `rgba(139, 147, 179, ${s.a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });

    const cx = w/2, cy = h/2;

    for(let arm = 0; arm < 4; arm++){
      const armOffset = (arm * Math.PI) / 2;
      ctx.beginPath();
      for(let t = 0; t < Math.PI*6; t += 0.02){
        const r = t * Math.min(w,h) * 0.025;
        const x = cx + Math.cos(t+armOffset)*r;
        const y = cy + Math.sin(t+armOffset)*r*0.4;
        t === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.05)';
      ctx.lineWidth = 15;
      ctx.stroke();
    }

    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w,h)*0.15);
    coreGrad.addColorStop(0, 'rgba(6, 182, 212, 0.15)');
    coreGrad.addColorStop(0.5, 'rgba(6, 182, 212, 0.05)');
    coreGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = coreGrad;
    ctx.fillRect(0, 0, w, h);

    const markerX = cx + w*0.15, markerY = cy - h*0.1;
    const pulseGrad = ctx.createRadialGradient(markerX, markerY, 0, markerX, markerY, 30);
    pulseGrad.addColorStop(0, 'rgba(6, 182, 212, 0.4)');
    pulseGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = pulseGrad;
    ctx.beginPath(); ctx.arc(markerX, markerY, 30, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#06b6d4';
    ctx.beginPath(); ctx.arc(markerX, markerY, 4, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = 'rgba(6, 182, 212, 0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(markerX, markerY, 10, 0, Math.PI*2); ctx.stroke();

    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillStyle = '#06b6d4';
    ctx.fillText(SYSTEM_INFO.shortName, markerX + 16, markerY + 4);

    ctx.strokeStyle = 'rgba(6, 182, 212, 0.03)';
    ctx.lineWidth = 0.5;
    for(let x = 0; x < w; x += 50){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for(let y = 0; y < h; y += 50){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  }

  function subscribeBases(){
    const citizensCol = collection(db, 'citizens');
    const q = query(citizensCol, where('status', '==', 'citizen'));
    onSnapshot(q, snap => {
      BASES = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
      renderBases();
      if(selectedPlanetIdx !== null) selectPlanet(selectedPlanetIdx);
    }, err => {
      document.getElementById('basesList').innerHTML =
        '<div class="no-bases">No se pudo cargar. Revisa las reglas de Firestore.</div>';
    });
  }

  renderPlanets();
  subscribeBases();
  drawGalaxyMap();

  window.addEventListener('resize', () => { starsCache = null; drawGalaxyMap(); });
</script>
</body>
</html>
