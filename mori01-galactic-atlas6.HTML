<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Atlas Galáctico - No Man's Sky</title>
    <style>
        body { margin: 0; background-color: #050510; color: #fff; font-family: sans-serif; overflow: hidden; }
        #ui-container { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(10, 10, 30, 0.85); padding: 15px; border-radius: 8px; border: 1px solid #3a3a8a; max-width: 300px; }
        input, button { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; background: #1a1a3a; border: 1px solid #5a5a9a; color: white; border-radius: 4px; }
        button { background: #3a3a9a; cursor: pointer; font-weight: bold; }
        button:hover { background: #5a5aha; }
        #lista-sistemas { max-height: 200px; overflow-y: auto; font-size: 12px; margin-top: 10px; padding: 0; list-style: none; }
        #lista-sistemas li { padding: 4px; border-bottom: 1px solid #222; }
    </style>
    <!-- Cargamos Three.js y OrbitControls para poder rotar el mapa 3D con el ratón -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-container">
        <h3>🌌 Añadir al Atlas</h3>
        <label for="glyph-input">Código de Glifos (12 dígitos Hex):</label>
        <input type="text" id="glyph-input" placeholder="Ej: 10A1FF7FF7FF" maxlength="12" value="10A1FF7FF7FF">
        <button onclick="registrarSistema()">Agregar Ubicación</button>
        
        <h4>📍 Puntos Registrados:</h4>
        <ul id="lista-sistemas"></ul>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN DEL ESPACIO 3D ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 500, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(scene.fog.color);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Iluminación básica
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // --- 2. PUNTO DE REFERENCIA: CENTRO GALÁCTICO ---
        const centroGeo = new THREE.SphereGeometry(15, 32, 32);
        const centroMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true });
        const centroGalaxia = new THREE.Mesh(centroGeo, centroMat);
        scene.add(centroGalaxia);

        // --- 3. ALGORITMO DE DECODIFICACIÓN ---
        function decodificarGlifos(hexStr) {
            if (hexStr.length !== 12) return null;
            
            // Estructura NMS: P-SSS-GG-YYY-XXX
            const pVal = parseInt(hexStr[0], 16);       // Planeta (0 a F)
            const sssVal = parseInt(hexStr.slice(1, 4), 16); // Sistema
            const yVal = parseInt(hexStr.slice(4, 6), 16);   // Altura (Y)
            const zVal = parseInt(hexStr.slice(6, 9), 16);   // Profundidad (Z)
            const xVal = parseInt(hexStr.slice(9, 12), 16);  // Horizontal (X)

            // Convertir aplicando los desfases (Offsets de NMS)
            let baseX = xVal - 0x7FF;
            let baseY = yVal - 0x7F;
            let baseZ = zVal - 0x7FF;

            // SOLUCIÓN A LA SUPERPOSICIÓN:
            // Si comparten sistema, modificamos levemente la posición final según el ID del planeta (P)
            // Esto esparce los planetas en órbitas simuladas alrededor del sol del sistema estelar
            const angulo = (pVal / 16) * Math.PI * 2;
            const radioDesviacion = pVal * 12; // Separación proporcional al número de planeta

            return {
                x: baseX + Math.cos(angulo) * radioDesviacion,
                y: baseY + (pVal * 2), // Desviación vertical leve
                z: baseZ + Math.sin(angulo) * radioDesviacion,
                planeta: pVal,
                sistema: sssVal
            };
        }

        // --- 4. GESTIÓN DINÁMICA DE ELEMENTOS ---
        const sistemasGuardados = [];

        function registrarSistema() {
            const input = document.getElementById('glyph-input');
            const hex = input.value.trim().toUpperCase();
            
            if(!/^[0-9A-F]{12}$/.test(hex)) {
                alert("Por favor introduce un código hexadecimal válido de 12 caracteres.");
                return;
            }

            const coords = decodificarGlifos(hex);
            if (!coords) return;

            // Crear el objeto 3D en el mapa
            const markerGeo = new THREE.SphereGeometry(6, 16, 16);
            // Color según el índice del planeta para diferenciarlos visualmente
            const colores = [0x00ffff, 0xff00ff, 0x00ff00, 0xff5555, 0xffff00, 0xff9900, 0x9900ff];
            const colorElegido = colores[coords.planeta % colores.length];
            
            const markerMat = new THREE.MeshBasicMaterial({ color: colorElegido });
            const marcador = new THREE.Mesh(markerGeo, markerMat);
            
            // Posicionar el marcador calculado
            marcador.position.set(coords.x, coords.y, coords.z);
            scene.add(marcador);

            // Dibujar una línea conectora al plano ecuatorial para dar perspectiva de profundidad
            const points = [];
            points.push(new THREE.Vector3(coords.x, 0, coords.z));
            points.push(new THREE.Vector3(coords.x, coords.y, coords.z));
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x3a3a5a });
            const linea = new THREE.Line(lineGeo, lineMat);
            scene.add(linea);

            // Guardar en memoria local de la app
            sistemasGuardados.push({ hex, coords });

            // Actualizar la interfaz HTML de control
            const lista = document.getElementById('lista-sistemas');
            const item = document.createElement('li');
            item.innerHTML = `🌐 <b>${hex}</b><br>X: ${coords.x.toFixed(0)} | Y: ${coords.y.toFixed(0)} | Z: ${coords.z.toFixed(0)} (Pl: ${coords.planeta})`;
            lista.appendChild(item);
        }

        // --- 5. BUCLE DE ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Ajuste de pantalla dinámico
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Iniciar el mapa 3D
        animate();
    </script>
</body>
</html>
