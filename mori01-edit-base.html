<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Base · MORI-01</title>
<style>
  :root{
    --bg-deep:#07080d; --bg-panel:#0c0f1c; --bg-panel-2:#10142a;
    --border-soft:#232842; --border-bright:#3a4270;
    --text-primary:#e8eaf2; --text-muted:#8b93b3; --text-dim:#565d80;
    --accent-cyan:#06b6d4; --accent-gold:#f5b849; --accent-violet:#7c6cff;
    --accent-red:#e8546b; --accent-green:#3ddc97;
    --font-display:"Eurostile","Michroma","Orbitron",system-ui,sans-serif;
    --font-body:"Titillium Web","Segoe UI",system-ui,sans-serif;
    --font-mono:"JetBrains Mono","Fira Code",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-deep); color:var(--text-primary); font-family:var(--font-body); line-height:1.5; min-height:100vh;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent-cyan); outline-offset:2px;}
  input,select,button{font-family:inherit; font-size:14px;}

  .wrap{max-width:720px; margin:0 auto; padding:48px 24px 80px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); margin-bottom:28px;}
  .back-link:hover{color:var(--accent-cyan);}
  .top-eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; color:var(--accent-gold); text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:10px;}
  .top-eyebrow::before{content:""; width:20px; height:1px; background:var(--accent-gold); opacity:.6;}
  h1{font-family:var(--font-display); font-weight:400; font-size:clamp(26px,4vw,36px); letter-spacing:.03em; margin-bottom:12px;}
  .lede{color:var(--text-muted); font-size:15px; max-width:620px; margin-bottom:32px;}

  .panel{background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:8px; padding:28px; margin-bottom:24px;}
  .panel h2{font-family:var(--font-display); font-weight:400; font-size:18px; letter-spacing:.03em; margin-bottom:6px;}
  .panel .sub{font-size:13px; color:var(--text-muted); margin-bottom:20px;}

  .alert{padding:13px 16px; border-radius:5px; font-size:13.5px; margin:14px 0; display:none;}
  .alert.show{display:block;}
  .alert-error{background:rgba(232,84,107,.1); border:1px solid rgba(232,84,107,.4); color:#ff8fa0;}
  .alert-ok{background:rgba(6,182,212,.1); border:1px solid rgba(6,182,212,.4); color:var(--accent-cyan);}

  .empty-state{color:var(--text-dim); font-size:13.5px; text-align:center; padding:40px 0; font-family:var(--font-mono);}
  .empty-state a{color:var(--accent-cyan); text-decoration:underline;}

  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; letter-spacing:.06em; color:var(--text-muted); text-transform:uppercase; margin-bottom:6px; font-family:var(--font-mono);}
  .field input, .field select{
    width:100%; background:var(--bg-panel-2); border:1px solid var(--border-soft); color:var(--text-primary);
    padding:10px 12px; border-radius:4px;
  }
  .field input:focus, .field select:focus{border-color:var(--accent-cyan);}

  .btn{font-weight:600; letter-spacing:.03em; padding:11px 22px; border-radius:4px; border:1px solid transparent; cursor:pointer; transition:all .2s; font-size:14px;}
  .btn-primary{background:var(--accent-cyan); color:var(--bg-deep);}
  .btn-primary:hover:not(:disabled){background:#31cbe6;}
  .btn-primary:disabled{opacity:.35; cursor:not-allowed;}
  .btn-ghost{border-color:var(--border-bright); color:var(--text-primary); background:transparent;}
  .btn-ghost:hover{border-color:var(--accent-gold); color:var(--accent-gold);}
  .btn-danger{border-color:rgba(232,84,107,.3); color:var(--accent-red); background:transparent;}
  .btn-danger:hover{border-color:var(--accent-red); background:rgba(232,84,107,.08);}

  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:24px;}

  .planet-picker{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:8px;}
  @media(min-width:480px){ .planet-picker{grid-template-columns:repeat(3,1fr);} }
  .planet-choice{
    background:var(--bg-panel-2); border:1px solid var(--border-soft); border-radius:6px;
    padding:10px; cursor:pointer; text-align:center; transition:border-color .15s, transform .15s;
  }
  .planet-choice:hover{border-color:var(--accent-cyan); transform:translateY(-2px);}
  .planet-choice.selected{border-color:var(--accent-gold); background:rgba(245,184,73,.08);}
  .planet-choice .pimg{width:100%; aspect-ratio:1; border-radius:5px; overflow:hidden; margin-bottom:8px; background:var(--bg-panel); border:1px solid var(--border-soft);}
  .planet-choice .pimg img{width:100%; height:100%; object-fit:cover; display:block;}
  .planet-choice .pname{font-size:12.5px; font-weight:600;}
  .planet-choice .pglyph{font-family:var(--font-mono); font-size:10px; color:var(--text-dim);}

  .photo-section{margin-top:24px; padding-top:20px; border-top:1px solid var(--border-soft);}
  .file-btn{
    font-family:var(--font-mono); font-size:12px; padding:9px 14px; border-radius:4px; cursor:pointer;
    border:1px solid var(--border-bright); background:var(--bg-panel-2); color:var(--text-primary);
    display:inline-flex; align-items:center; gap:8px;
  }
  .file-btn:hover{border-color:var(--accent-cyan); color:var(--accent-cyan);}
  .photo-hint{font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); margin-top:8px;}
  .photo-note{font-size:11.5px; font-family:var(--font-mono); color:var(--accent-gold); margin-top:8px;}
  .photo-note.rejected{color:var(--accent-red);}
  .photo-note.approved{color:var(--accent-green);}
  .photo-preview{margin-top:12px;}
  .photo-preview img{max-width:240px; border-radius:6px; border:1px solid var(--border-bright);}

  .loading-state{text-align:center; padding:60px 0; color:var(--text-dim); font-family:var(--font-mono); font-size:13px;}
  .hint{font-size:11.5px; color:var(--text-dim); margin-top:6px; font-family:var(--font-mono);}
  .base-switcher{margin-bottom:24px;}
  .base-switcher-label{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; color:var(--text-dim); text-transform:uppercase; margin-bottom:8px;}
  .base-switcher-list{display:flex; gap:8px; flex-wrap:wrap;}
  .base-switcher-item{
    font-family:var(--font-mono); font-size:12px; padding:8px 14px; border-radius:6px;
    border:1px solid var(--border-soft); background:var(--bg-panel-2); color:var(--text-muted);
    text-decoration:none; transition:all .2s; white-space:nowrap; display:inline-flex; flex-direction:column; gap:2px;
  }
  .base-switcher-item:hover{border-color:var(--accent-cyan); color:var(--accent-cyan);}
  .base-switcher-item.active{border-color:var(--accent-gold); color:var(--accent-gold); background:rgba(245,184,73,.08);}
  .base-switcher-item .bsi-id{font-weight:600; font-size:12px;}
  .base-switcher-item .bsi-detail{font-size:10px; color:var(--text-dim);}
  .base-here-badge{
    display:inline-block; margin-top:6px; padding:3px 8px; border-radius:4px; font-size:10px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; font-family:var(--font-mono);
    background:rgba(232,84,107,.15); border:1px solid rgba(232,84,107,.5); color:var(--accent-red);
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" id="backLink" href="./mori01-mi-ciudadania.html">← Volver a Mi Ciudadanía</a>
  <div class="top-eyebrow"><span>MORI-01</span></div>
  <h1>Editar Base</h1>
  <p class="lede" id="pageLede">Modifica los datos de tu base. Al guardar, los cambios se enviarán al Arcade para revisión si es necesario.</p>

  <div id="authBox" class="panel" style="display:none;"></div>
  <div id="baseSwitcher"></div>

  <div id="content">
    <div class="loading-state">Cargando datos de la base…</div>
  </div>
</div>

<script type="module">
  import { db, auth, storage, signInWithGoogle, signOutPlayer, onAuthStateChanged } from './firebase-config.js';
  import { PLANETS, SYSTEM_INFO, planetImg } from './mori01-data.js';
  import {
    doc, getDoc, getDocs, updateDoc, deleteDoc, runTransaction, collection, query, where, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    ref, uploadBytes, getDownloadURL
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  document.getElementById('backLink').textContent = `← Volver a Mi Ciudadanía`;
  document.title = `Editar Base · ${SYSTEM_INFO.shortName}`;

  const params = new URLSearchParams(window.location.search);
  const docId = params.get('docId');
  const MAX_FILE_BYTES = 5 * 1024 * 1024;

  if(!docId){
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        No se especificó ninguna base.<br><br>
        <a href="./mori01-mi-ciudadania.html">Volver a Mi Ciudadanía</a>
      </div>`;
  }else initApp();

  function escapeHtml(s){
    if(!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function initApp(){
    const citizensCol = collection(db, 'citizens');
    const authBox = document.getElementById('authBox');
    let currentUser = null;

    function renderAuthBox(){
      if(currentUser){
        authBox.style.display = 'none';
      }else{
        authBox.style.display = 'block';
        authBox.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;">
            <div style="font-size:13px;color:var(--text-muted);">Inicia sesión con Google para editar tu base.</div>
            <button class="google-btn" id="googleBtn">
              <svg viewBox="0 0 48 48" width="16" height="16"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.3 18.9 12 24 12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.5l-6.5-5.5C29.6 34.9 26.9 36 24 36c-5.4 0-9.9-3.4-11.3-8.1l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.6 4.8-4.7 6.4l6.5 5.5C40.7 37.5 44 31.3 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
              Iniciar sesión con Google
            </button>
          </div>`;
        document.getElementById('googleBtn').addEventListener('click', async ()=>{
          try{ await signInWithGoogle(); }
          catch(e){ /* el propio botón ya da feedback */ }
        });
      }
    }

    onAuthStateChanged(auth, user=>{
      currentUser = user;
      renderAuthBox();
      if(user){
        loadBase();
      }else{
        document.getElementById('content').innerHTML =
          '<div class="empty-state">Inicia sesión con Google para editar tu base.</div>';
      }
    });

    async function loadBase(){
      const contentBox = document.getElementById('content');
      try{
        const snap = await getDoc(doc(db, 'citizens', docId));
        if(!snap.exists()){
          contentBox.innerHTML = `
            <div class="empty-state">
              Base no encontrada.<br><br>
              <a href="./mori01-mi-ciudadania.html">Volver a Mi Ciudadanía</a>
            </div>`;
          return;
        }
        const data = snap.data();
        if(!currentUser || data.ownerUid !== currentUser.uid){
          contentBox.innerHTML = `
            <div class="empty-state">
              No tienes permiso para editar esta base.<br><br>
              Solo el propietario puede editar su propia base.<br><br>
              <a href="./mori01-mi-ciudadania.html">Volver a Mi Ciudadanía</a>
            </div>`;
          return;
        }

        let allBases = [];
        try{
          const q = query(citizensCol, where('ownerUid', '==', currentUser.uid), orderBy('ts', 'desc'));
          const allSnap = await getDocs(q);
          allBases = allSnap.docs.map(d => ({ _docId: d.id, ...d.data() }));
        }catch(e){ /* si falla, solo muestra la base actual */ }

        renderBaseSwitcher(allBases, docId);
        renderEditForm(data);
      }catch(e){
        contentBox.innerHTML = `
          <div class="empty-state">
            Error al cargar la base.<br><br>
            <a href="./mori01-mi-ciudadania.html">Volver a Mi Ciudadanía</a>
          </div>`;
      }
    }

    function renderBaseSwitcher(allBases, activeDocId){
      if(allBases.length <= 1) return;
      const switcher = document.getElementById('baseSwitcher');
      switcher.innerHTML = `
        <div class="base-switcher-label">Tus ${allBases.length} bases</div>
        <div class="base-switcher-list">
          ${allBases.map(b => {
            const p = PLANETS.find(pl => pl.i === b.planetIndex);
            const isActive = b._docId === activeDocId;
            return `<a href="./mori01-edit-base.html?docId=${encodeURIComponent(b._docId)}" class="base-switcher-item ${isActive ? 'active' : ''}">
              <span class="bsi-id">${escapeHtml(b.id || '—')}</span>
              <span class="bsi-detail">${p ? escapeHtml(p.name) : '—'} · ${escapeHtml(String(b.lat))}, ${escapeHtml(String(b.lon))}</span>
            </a>`;
          }).join('')}
        </div>`;
    }

    function renderEditForm(base){
      const contentBox = document.getElementById('content');
      const hasPhoto = base.photoUrl && base.photoStatus === 'approved';
      const photoPending = base.photoStatus === 'pending' && base.photoUrl;
      const photoRejected = base.photoStatus === 'rejected';
      const pillText = base.status === 'citizen' ? 'Ciudadano' : base.status === 'rejected' ? 'Rechazada' : 'Pendiente';

      contentBox.innerHTML = `
        <div class="panel">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
            <div>
              <h2 style="margin:0;">${base.id}</h2>
              <div style="margin-top:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <span style="font-size:13px;color:var(--text-muted);">Sistema: <b style="color:var(--accent-cyan);">${SYSTEM_INFO.shortName}</b></span>
                <span style="font-family:var(--font-mono);font-size:10.5px;padding:4px 10px;border-radius:20px;background:rgba(245,184,73,.12);border:1px solid rgba(245,184,73,.4);color:var(--accent-gold);">${pillText}</span>
              </div>
            </div>
          </div>

          <div id="editAlert" class="alert"></div>

          <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">Selecciona el planeta donde se encuentra tu base:</p>
          <div class="planet-picker" id="planetPicker"></div>
          <select id="planetSelect" style="display:none"></select>

          <div class="field-row" style="margin-top:20px;">
            <div class="field">
              <label for="editLat">Latitud</label>
              <input type="text" id="editLat" value="${escapeHtml(String(base.lat))}" placeholder="+14.32">
            </div>
            <div class="field">
              <label for="editLon">Longitud</label>
              <input type="text" id="editLon" value="${escapeHtml(String(base.lon))}" placeholder="-21.96">
            </div>
          </div>
          <p class="hint">Formato del juego: signo, grados, dos decimales. Ej: +14.32, -21.96</p>

          <div class="photo-section">
            <label class="file-btn" for="basePhotoInput">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.2"/><path d="M8 6l1.5-2h5L16 6"/></svg>
              ${hasPhoto ? 'Cambiar foto de base' : 'Subir foto de base'}
            </label>
            <input type="file" id="basePhotoInput" accept="image/*" style="display:none">
            <p class="photo-hint">Foto del entorno de tu base en el juego. JPG o PNG, máximo 5MB.<br>Toda foto nueva queda pendiente de aprobación del Arcade.</p>
            <p class="photo-note" id="photoStatus"></p>
            ${hasPhoto ? `<div class="photo-preview"><img src="${base.photoUrl}" alt="Foto de base"></div>` : ''}
          </div>

          <div class="btn-row">
            <button class="btn btn-primary" id="saveBtn">Guardar cambios</button>
            <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
            <button class="btn btn-danger" id="deleteBtn" style="margin-left:auto;">Eliminar base</button>
          </div>
        </div>
      `;

      const planetSelect = document.getElementById('planetSelect');
      const planetPicker = document.getElementById('planetPicker');
      PLANETS.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.i;
        opt.textContent = `${p.name} (glifo ${p.i})`;
        if(p.i === base.planetIndex) opt.selected = true;
        planetSelect.appendChild(opt);

        const card = document.createElement('div');
        const isCurrentPlanet = p.i === base.planetIndex;
        card.className = 'planet-choice' + (isCurrentPlanet ? ' selected' : '');
        card.innerHTML = `<div class="pimg">${planetImg(p)}</div><div class="pname">${p.name}</div><div class="pglyph">Glifo ${p.i}</div>${isCurrentPlanet ? '<div class="base-here-badge">📍 Tu base está aquí</div>' : ''}`;
        card.addEventListener('click', () => {
          planetSelect.value = p.i;
          planetPicker.querySelectorAll('.planet-choice').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
        });
        planetPicker.appendChild(card);
      });

      const photoStatusEl = document.getElementById('photoStatus');
      if(photoPending){
        photoStatusEl.textContent = 'Foto pendiente de aprobación del Arcade.';
        photoStatusEl.className = 'photo-note';
      }else if(photoRejected){
        photoStatusEl.textContent = 'Última foto rechazada. Sube otra para reemplazarla.';
        photoStatusEl.className = 'photo-note rejected';
      }else if(hasPhoto){
        photoStatusEl.textContent = '✓ Foto aprobada por el Arcade.';
        photoStatusEl.className = 'photo-note approved';
      }

      document.getElementById('basePhotoInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        if(!file.type.startsWith('image/')){
          photoStatusEl.textContent = 'Solo se permiten imágenes.';
          photoStatusEl.className = 'photo-note rejected';
          return;
        }
        if(file.size > MAX_FILE_BYTES){
          photoStatusEl.textContent = 'La imagen pesa más de 5MB.';
          photoStatusEl.className = 'photo-note rejected';
          return;
        }
        photoStatusEl.textContent = 'Subiendo…';
        photoStatusEl.className = 'photo-note';
        try{
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
          const storageRef = ref(storage, `bases/${docId}-basephoto.${ext}`);
          await uploadBytes(storageRef, file);
          const url = await getDownloadURL(storageRef);
          await updateDoc(doc(db, 'citizens', docId), { photoUrl: url, photoStatus: 'pending' });
          try{
            const usageRef = doc(db, 'storageUsage', 'usage');
            await runTransaction(db, async (tx) => {
              const snap = await tx.get(usageRef);
              const current = snap.exists() ? (snap.data().bytesUsed || 0) : 0;
              tx.update(usageRef, { bytesUsed: current + file.size });
            });
          }catch(e){ /* silencioso */ }
          base.photoUrl = url;
          base.photoStatus = 'pending';
          photoStatusEl.textContent = 'Foto subida — pendiente de aprobación del Arcade.';
          photoStatusEl.className = 'photo-note';
          const preview = document.querySelector('.photo-preview');
          if(preview){
            preview.querySelector('img').src = url;
          }else{
            const sec = document.querySelector('.photo-section');
            const pEl = document.createElement('div');
            pEl.className = 'photo-preview';
            pEl.innerHTML = `<img src="${url}" alt="Foto de base">`;
            sec.insertBefore(pEl, document.querySelector('.btn-row'));
          }
        }catch(err){
          photoStatusEl.textContent = 'No se pudo subir la foto.';
          photoStatusEl.className = 'photo-note rejected';
        }
      });

      document.getElementById('cancelBtn').addEventListener('click', () => {
        window.location.href = './mori01-mi-ciudadania.html';
      });

      document.getElementById('saveBtn').addEventListener('click', async () => {
        const alertBox = document.getElementById('editAlert');
        const planetIndex = parseInt(planetSelect.value, 10);
        const lat = parseFloat(String(document.getElementById('editLat').value).replace(',', '.').trim());
        const lon = parseFloat(String(document.getElementById('editLon').value).replace(',', '.').trim());

        if(!planetIndex){ alertBox.textContent = 'Selecciona un planeta.'; alertBox.className = 'alert show alert-error'; return; }
        if(isNaN(lat) || isNaN(lon)){ alertBox.textContent = 'Coordenadas inválidas.'; alertBox.className = 'alert show alert-error'; return; }

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Guardando…';
        try{
          await updateDoc(doc(db, 'citizens', docId), { planetIndex, lat, lon });
          alertBox.textContent = 'Base actualizada. Redirigiendo…';
          alertBox.className = 'alert show alert-ok';
          setTimeout(() => {
            window.location.href = './mori01-mi-ciudadania.html';
          }, 1000);
        }catch(e){
          alertBox.textContent = 'No se pudo guardar. Intenta de nuevo.';
          alertBox.className = 'alert show alert-error';
          saveBtn.disabled = false;
          saveBtn.textContent = 'Guardar cambios';
        }
      });

      document.getElementById('deleteBtn').addEventListener('click', async () => {
        if(!confirm('¿Eliminar esta base? Esta acción no se puede deshacer.')) return;
        const alertBox = document.getElementById('editAlert');
        try{
          await deleteDoc(doc(db, 'citizens', docId));
          alertBox.textContent = 'Base eliminada. Redirigiendo…';
          alertBox.className = 'alert show alert-ok';
          setTimeout(() => {
            window.location.href = './mori01-mi-ciudadania.html';
