<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Local · MORI-01</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');

  :root {
    --bg-deep:#07080d; --bg-panel:#0c0f1c; --bg-panel-2:#10142a;
    --border-soft:#232842; --border-bright:#3a4270;
    --text-primary:#e8eaf2; --text-muted:#8b93b3; --text-dim:#565d80;
    --accent-cyan:#06b6d4; --accent-gold:#f5b849; --accent-violet:#7c6cff;
    --accent-red:#e8546b; --accent-green:#3ddc97;
    --font-display:"Eurostile","Michroma","Orbitron",system-ui,sans-serif;
    --font-body:"Titillium Web","Segoe UI",system-ui,sans-serif;
    --font-mono:"JetBrains Mono","Fira Code",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-deep); color:var(--text-primary); font-family:var(--font-body); line-height:1.5; min-height:100vh;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent-cyan); outline-offset:2px;}

  .wrap{max-width:1180px; margin:0 auto; padding:44px 24px 80px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); margin-bottom:24px; text-decoration:none;}
  .back-link:hover{color:var(--accent-cyan);}
  .top-eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; color:var(--accent-gold); text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:10px;}
  .top-eyebrow::before{content:""; width:20px; height:1px; background:var(--accent-gold); opacity:.6;}
  h1{font-family:var(--font-display); font-weight:400; font-size:clamp(28px,5vw,42px); letter-spacing:.03em; margin-bottom:12px;}
  .lede{color:var(--text-muted); font-size:15px; max-width:660px; margin-bottom:32px;}

  .grid-layout{display:grid; grid-template-columns:1fr 300px; gap:18px; margin-bottom:18px;}
  @media(max-width:1000px){ .grid-layout{grid-template-columns:1fr;} }

  .panel{background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:8px; padding:22px; margin-bottom:18px;}
  .panel-label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.18em; color:var(--accent-gold);
    text-transform:uppercase; margin-bottom:16px; display:flex; align-items:center; gap:8px;
  }
  .panel-label::before{content:""; width:7px; height:7px; border:1px solid var(--accent-gold); transform:rotate(45deg); flex-shrink:0;}

  .system-map{
    position:relative; width:100%; aspect-ratio:1; background:var(--bg-deep);
    border-radius:6px; overflow:hidden; border:1px solid var(--border-soft);
    max-height:70vh;
  }
  .system-map canvas{width:100%; height:100%; display:block;}

  .planet-list{display:flex; flex-direction:column; gap:8px;}
  .planet-item{
    display:flex; align-items:center; gap:10px; padding:10px;
    background:var(--bg-panel-2); border:1px solid var(--border-soft); border-radius:6px;
    cursor:pointer; transition:border-color .2s;
  }
  .planet-item:hover, .planet-item.active{border-color:var(--accent-cyan);}
  .planet-item-img{width:38px; height:38px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--bg-panel);}
  .planet-item-img img{width:100%; height:100%; object-fit:cover;}
  .planet-item-info{flex:1; min-width:0;}
  .planet-item-name{font-family:var(--font-display); font-size:12px; letter-spacing:.02em;}
  .planet-item-climate{font-family:var(--font-mono); font-size:10px; color:var(--text-muted);}
  .planet-item-count{font-family:var(--font-mono); font-size:11px; color:var(--accent-gold); flex-shrink:0;}

  .bases-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:10px;}
  .base-card{
    display:flex; align-items:center; gap:14px; padding:14px; background:var(--bg-panel-2);
    border:1px solid var(--border-soft); border-radius:6px; transition:border-color .2s;
  }
  .base-card:hover{border-color:var(--accent-cyan);}
  .base-avatar{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(145deg, var(--accent-cyan), var(--accent-violet));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:16px; color:var(--bg-deep);
    overflow:hidden;
  }
  .base-avatar img{width:100%; height:100%; object-fit:cover;}
  .base-info{flex:1; min-width:0;}
  .base-info h3{font-family:var(--font-display); font-size:14px; font-weight:400; margin-bottom:2px;}
  .base-info p{font-size:11.5px; color:var(--text-muted); font-family:var(--font-mono); margin-top:2px;}
  .base-info .highlight{color:var(--accent-cyan);}
  .base-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .base-tag{
    font-family:var(--font-mono); font-size:10px; padding:2px 8px; border-radius:20px;
    background:var(--bg-panel); border:1px solid var(--border-soft); color:var(--text-muted);
  }
  .base-tag.role{border-color:rgba(124,108,255,.4); color:var(--accent-violet);}

  .no-bases{text-align:center; padding:40px 0; color:var(--text-dim); font-family:var(--font-mono); font-size:13px;}

  .map-tooltip{
    position:fixed; pointer-events:none; background:rgba(7,8,13,.92); border:1px solid var(--border-bright);
    border-radius:4px; padding:10px 14px; font-family:var(--font-mono); font-size:11px;
    color:var(--text-muted); z-index:100; display:none; max-width:260px;
  }
  .map-tooltip .tt-name{font-weight:bold; color:var(--accent-gold); margin-bottom:4px; font-size:12px;}
  .map-tooltip .tt-coords{color:var(--accent-cyan);}
  .map-tooltip .tt-id{color:var(--text-dim); font-size:10px; margin-top:3px;}
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="./index.html" id="backLink">← Volver</a>
  <p class="top-eyebrow">Mapa del sistema</p>
  <h1>Mapa Local</h1>
  <p class="lede" id="lede">Distribución de bases en los planetas de MORI-01.</p>

  <div class="grid-layout">
    <div class="panel">
      <div class="panel-label">Mapa del Sistema</div>
      <div class="system-map">
        <canvas id="systemCanvas"></canvas>
      </div>
    </div>
    <div class="panel">
      <div class="panel-label">Cuerpos Celestes</div>
      <div class="planet-list" id="planetList"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-label">Bases de la Comunidad</div>
    <div class="bases-grid" id="basesList"></div>
  </div>

</div>

<div class="map-tooltip" id="tooltip">
  <div class="tt-name"></div>
  <div class="tt-coords"></div>
  <div class="tt-id"></div>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { PLANETS, SYSTEM_INFO, SYSTEM_SIGNATURE, glyphSVG, planetImg } from './mori01-data.js';
  import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  document.getElementById('backLink').textContent = `← Volver a ${SYSTEM_INFO.shortName}`;
  document.title = `Mapa Local · ${SYSTEM_INFO.shortName}`;
  document.getElementById('lede').textContent =
    `Distribución de bases en los planetas de ${SYSTEM_INFO.shortName}.`;

  let BASES = [];

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s ?? '';
    return d.innerHTML;
  }

  function findPlanetByIndex(idx){
    return PLANETS.find(p => p.i === idx) || null;
  }

  let selectedPlanetIdx = null;
  let starsCache = null;
  let hoveredBase = null;

  const PLANET_ORBITS = PLANETS.map((p, i) => {
    const angle = (i / PLANETS.length) * Math.PI * 2 - Math.PI / 2;
    return { planet: p, angle, _x: 0, _y: 0, _radius: 0 };
  });

  function coordsToPixels(lat, lon, planetCenterX, planetCenterY, radius){
    const x = planetCenterX + (lon / 180) * radius;
    const y = planetCenterY - (lat / 180) * radius;
    return { x, y };
  }

  function renderPlanetSidebar(){
    const list = document.getElementById('planetList');
    list.innerHTML = PLANETS.map((p, idx) => {
      const count = BASES.filter(b => b.planetIndex === p.i).length;
      return `
        <div class="planet-item ${idx === selectedPlanetIdx ? 'active' : ''}" data-idx="${idx}">
          <div class="planet-item-img">${planetImg(p)}</div>
          <div class="planet-item-info">
            <div class="planet-item-name">${p.name}${p.capital ? ' ★' : ''}</div>
            <div class="planet-item-climate">${p.clima}</div>
          </div>
          <div class="planet-item-count">${count}</div>
        </div>
      `;
    }).join('');

    list.querySelectorAll('.planet-item').forEach(item => {
      item.addEventListener('click', () => selectPlanet(parseInt(item.dataset.idx, 10)));
    });

    if(selectedPlanetIdx === null){
      const capitalIdx = PLANETS.findIndex(p => p.capital);
      selectPlanet(capitalIdx >= 0 ? capitalIdx : 0);
    }
  }

  function selectPlanet(idx){
    selectedPlanetIdx = idx;
    document.querySelectorAll('.planet-item').forEach((item, i) => item.classList.toggle('active', i === idx));
    drawSystemMap();
  }

  function renderBases(){
    const container = document.getElementById('basesList');

    if(!BASES.length){
      container.innerHTML = '<div class="no-bases">No hay bases aprobadas aún.</div>';
      return;
    }

    container.innerHTML = BASES.map(base => {
      const planet = findPlanetByIndex(base.planetIndex);
      const planetName = planet ? planet.name : '—';
      const initials = (base.name || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
      const tags = [
        base.role ? `<span class="base-tag role">${escapeHtml(base.role)}</span>` : '',
        base.profession ? `<span class="base-tag">${escapeHtml(base.profession)}</span>` : '',
        base.platform ? `<span class="base-tag">${escapeHtml(base.platform)}</span>` : '',
      ].join('');

      const avatarContent = base.photoUrl
        ? `<img src="${escapeHtml(base.photoUrl)}" alt="${escapeHtml(base.name || '')}">`
        : initials;

      return `
        <div class="base-card" data-planet-index="${base.planetIndex}">
          <div class="base-avatar">${avatarContent}</div>
          <div class="base-info">
            <h3>${escapeHtml(base.name || 'Sin nombre')}</h3>
            <p><span class="highlight">${planetName}</span> · +${base.lat}, +${base.lon}</p>
            <p>${base.id} · ${escapeHtml(base.platform || '—')}</p>
            <div class="base-tags">${tags}</div>
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.base-card').forEach(card => {
      card.addEventListener('mouseenter', () => {
        const pidx = parseInt(card.dataset.planetIndex, 10);
        const idx = PLANETS.findIndex(p => p.i === pidx);
        if(idx >= 0) selectPlanet(idx);
      });
    });
  }

  let tooltipMouseX = 0, tooltipMouseY = 0, tooltipPageX = 0, tooltipPageY = 0;

  function drawSystemMap(){
    const canvas = document.getElementById('systemCanvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();

    const size = Math.min(rect.width, rect.height);
    canvas.width = size * 2;
    canvas.height = size * 2;
    ctx.scale(2, 2);

    const w = size, h = size, cx = w/2, cy = h/2;

    ctx.fillStyle = '#07080d';
    ctx.fillRect(0, 0, w, h);

    if(!starsCache || starsCache.w !== w || starsCache.h !== h){
      starsCache = { w, h, dots: [] };
      for(let i = 0; i < 200; i++){
        starsCache.dots.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1, a: Math.random()*0.5+0.1 });
      }
    }
    starsCache.dots.forEach(s => {
      ctx.fillStyle = `rgba(139, 147, 179, ${s.a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });

    const starGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 25);
    starGrad.addColorStop(0, '#fff8e1');
    starGrad.addColorStop(0.3, '#ffd740');
    starGrad.addColorStop(0.7, '#ff8f0044');
    starGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = starGrad;
    ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#ffd740';
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();

    ctx.font = '9px "JetBrains Mono", monospace';
    ctx.fillStyle = '#ffd740aa';
    ctx.fillText('MRNG', cx + 12, cy + 3);

    const maxRadius = Math.min(w, h) * 0.42;
    const minRadius = Math.min(w, h) * 0.18;

    hoveredBase = null;
    const tooltipEl = document.getElementById('tooltip');

    PLANET_ORBITS.forEach((po, idx) => {
      const orbitRadius = minRadius + (maxRadius - minRadius) * (idx / (PLANET_ORBITS.length - 1 || 1));
      const isSelected = idx === selectedPlanetIdx;

      ctx.strokeStyle = isSelected ? 'rgba(6,182,212,0.25)' : 'rgba(255,255,255,0.04)';
      ctx.lineWidth = isSelected ? 1.5 : 0.5;
      ctx.beginPath(); ctx.arc(cx, cy, orbitRadius, 0, Math.PI*2); ctx.stroke();

      const px = cx + Math.cos(po.angle) * orbitRadius;
      const py = cy + Math.sin(po.angle) * orbitRadius;
      po._x = px; po._y = py; po._radius = orbitRadius;

      const planetRadius = isSelected ? 18 : 14;

      if(isSelected){
        const glow = ctx.createRadialGradient(px, py, 0, px, py, planetRadius + 10);
        glow.addColorStop(0, 'rgba(6,182,212,0.15)');
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(px, py, planetRadius + 10, 0, Math.PI*2); ctx.fill();
      }

      ctx.fillStyle = isSelected ? '#06b6d4' : '#4dd0e1';
      ctx.beginPath(); ctx.arc(px, py, planetRadius, 0, Math.PI*2); ctx.fill();

      ctx.strokeStyle = isSelected ? '#06b6d4' : 'rgba(77,208,225,0.5)';
      ctx.lineWidth = isSelected ? 2 : 1;
      ctx.beginPath(); ctx.arc(px, py, planetRadius, 0, Math.PI*2); ctx.stroke();

      ctx.font = `${isSelected ? 'bold ' : ''}9px "Orbitron", sans-serif`;
      ctx.fillStyle = isSelected ? '#e8eaf2' : '#8b93b3';
      ctx.textAlign = 'center';
      ctx.fillText(po.planet.name, px, py - planetRadius - 8);
      ctx.textAlign = 'left';

      const planetBases = BASES.filter(b => b.planetIndex === po.planet.i);
      const baseRadius = planetRadius * 0.6;

      planetBases.forEach(base => {
        const bPos = coordsToPixels(base.lat, base.lon, px, py, baseRadius);
        const bx = bPos.x, by = bPos.y;

        const dx = tooltipMouseX - bx, dy = tooltipMouseY - by;
        if(Math.sqrt(dx*dx + dy*dy) < 10) hoveredBase = base;

        ctx.strokeStyle = 'rgba(245,184,73,0.7)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI*2); ctx.stroke();

        ctx.fillStyle = '#f5b849';
        ctx.beginPath(); ctx.arc(bx, by, 2, 0, Math.PI*2); ctx.fill();
      });
    });

    if(hoveredBase){
      const planet = findPlanetByIndex(hoveredBase.planetIndex);
      tooltipEl.style.display = 'block';
      tooltipEl.querySelector('.tt-name').textContent = hoveredBase.name || 'Sin nombre';
      tooltipEl.querySelector('.tt-coords').textContent = `${planet ? planet.name : '—'} · +${hoveredBase.lat}, +${hoveredBase.lon}`;
      tooltipEl.querySelector('.tt-id').textContent = hoveredBase.id;

      let tx = tooltipPageX + 14, ty = tooltipPageY - 60;
      if(tx + 260 > window.innerWidth) tx = tooltipPageX - 270;
      if(ty < 0) ty = tooltipPageY + 14;
      tooltipEl.style.left = tx + 'px';
      tooltipEl.style.top = ty + 'px';
    } else {
      tooltipEl.style.display = 'none';
    }
  }

  function setupMapInteraction(){
    const canvas = document.getElementById('systemCanvas');
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      tooltipMouseX = (e.clientX - rect.left) * (canvas.width / 2 / rect.width);
      tooltipMouseY = (e.clientY - rect.top) * (canvas.height / 2 / rect.height);
      tooltipPageX = e.clientX;
      tooltipPageY = e.clientY;
      drawSystemMap();
    });
    canvas.addEventListener('mouseleave', () => {
      tooltipMouseX = -100; tooltipMouseY = -100; hoveredBase = null;
      drawSystemMap();
      document.getElementById('tooltip').style.display = 'none';
    });
  }

  function subscribeBases(){
    const citizensCol = collection(db, 'citizens');
    const q = query(citizensCol, where('status', '==', 'citizen'));
    onSnapshot(q, snap => {
      BASES = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
      renderPlanetSidebar();
      renderBases();
      drawSystemMap();
    }, err => {
      document.getElementById('basesList').innerHTML =
        '<div class="no-bases">No se pudo cargar. Revisa las reglas de Firestore.</div>';
    });
  }

  setupMapInteraction();
  subscribeBases();

  window.addEventListener('resize', () => { starsCache = null; drawSystemMap(); });
</script>
</body>
</html>
