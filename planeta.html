<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORI-01 · Asentamiento planetario</title>
    <style>
        :root{
            --bg-deep:#010103;
            --accent-cyan:#7ef3ff;
            --accent-cyan-dim:#1a5f7a;
            --font-display: system-ui, sans-serif;
            --font-mono: monospace;
        }
        *{box-sizing:border-box;}
        body{ margin:0; overflow:hidden; background-color:var(--bg-deep); font-family:sans-serif; }
        
        #info-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(2, 2, 8, 0.85);
            color: #7ef3ff; padding: 20px; border-radius: 8px; border: 1px solid #1a5f7a;
            pointer-events: none; text-transform: uppercase; letter-spacing: 1px; z-index: 10;
            box-shadow: 0 0 20px rgba(126, 243, 255, 0.2); max-width:280px;
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #fff; text-shadow: 0 0 10px #7ef3ff; font-family:var(--font-display); font-weight:400; letter-spacing:.03em; }
        .stat { margin: 5px 0; font-size: 13px; font-family:var(--font-mono); }
        .label { color: #888; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
    </style>
</head>
<body>

<div id="info-panel">
    <h1>Aizinia ★</h1>
    <div class="stat"><span class="label">Clima:</span> <span style="color:#55ff55;">Apacible</span></div>
    <div class="stat"><span class="label">Centinelas:</span> <span style="color:#ffaa00;">Remoto</span></div>
    <div class="stat"><span class="label">Flora:</span> Generoso</div>
    <div class="stat"><span class="label">Fauna:</span> Abundante</div>
    <div class="stat" style="margin-top:10px;"><span class="label">Recursos:</span> <br><span style="color:#fff; font-size:11px;">Bulbo Estelar · Plata · Parafino · Cobre</span></div>
</div>

<div id="canvas-container"></div>

<!-- Recursos estables de Three.js -->
<script src="https://cloudflare.com"></script>
<script src="https://jsdelivr.net"></script>

<script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2.2;
    controls.maxDistance = 15;

    const sunLight = new THREE.DirectionalLight(0xffffff, 2.6);
    sunLight.position.set(8, 2, 5);
    scene.add(sunLight);

    const spaceLight = new THREE.AmbientLight(0x050510, 0.15);
    scene.add(spaceLight);

    const planetGroup = new THREE.Group();
    scene.add(planetGroup);

    // Carga de tus 4 imágenes reales (Alojadas en la nube de forma segura)
    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous'); 

    // Enlaces directos a las imágenes exactas que me enviaste
    const imgColor = textureLoader.load('https://allorigins.win');
    const imgClouds = textureLoader.load('https://allorigins.win');
    const imgLights = textureLoader.load('https://allorigins.win');
    const imgSpace = textureLoader.load('https://allorigins.win');

    // 1. FONDO ESPACIAL (Tu Skybox real)
    const spaceGeo = new THREE.SphereGeometry(90, 32, 32);
    const spaceMat = new THREE.MeshBasicMaterial({ map: imgSpace, side: THREE.BackSide });
    const spaceMesh = new THREE.Mesh(spaceGeo, spaceMat);
    scene.add(spaceMesh);

    // 2. CAPA PLANETARIA (Color + Relieve + Luces nocturnas)
    const planetGeo = new THREE.SphereGeometry(1.5, 64, 64);
    const planetMat = new THREE.MeshStandardMaterial({
        map: imgColor,
        bumpMap: imgColor,
        bumpScale: 0.035,
        emissiveMap: imgLights,
        emissive: new THREE.Color(0xffbb44), 
        emissiveIntensity: 4.0,
        roughness: 0.7,
        metalness: 0.1
    });

    planetMat.onBeforeCompile = (shader) => {
        shader.fragmentShader = shader.fragmentShader.replace(
            '#include <roughnessmap_fragment>',
            `#include <roughnessmap_fragment>
             float bumpVal = texture2D(bumpMap, vUv).r;
             roughnessFactor = mix(0.12, 0.85, bumpVal);`
        );
    };

    const planetMesh = new THREE.Mesh(planetGeo, planetMat);
    planetGroup.add(planetMesh);

    // 3. CAPA ATMOSFÉRICA (Tus nubes)
    const cloudGeo = new THREE.SphereGeometry(1.514, 64, 64);
    const cloudMat = new THREE.MeshStandardMaterial({
        alphaMap: imgClouds,
        transparent: true,
        color: 0xffffff,
        blending: THREE.NormalBlending
    });
    const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
    planetGroup.add(cloudMesh);

    // 4. BALIZAS DE ORIENTACIÓN ESPACIAL
    function addNavPoint(lat, lon, colorHex) {
        const radius = 1.516;
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 180) * (Math.PI / 180);

        const x = -(radius * Math.sin(phi) * Math.sin(theta));
        const y = radius * Math.cos(phi);
        const z = radius * Math.sin(phi) * Math.cos(theta);

        const markerGeo = new THREE.SphereGeometry(0.025, 16, 16);
        const markerMat = new THREE.MeshBasicMaterial({ color: colorHex });
        const markerMesh = new THREE.Mesh(markerGeo, markerMat);
        markerMesh.position.set(x, y, z);
        
        const ringGeo = new THREE.RingGeometry(0.01, 0.04, 16);
        const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.lookAt(new THREE.Vector3(0,0,0));
        markerMesh.add(ringMesh);

        planetGroup.add(markerMesh);
    }

    addNavPoint(20, 25, 0xff2a6d);   // Baliza 1
    addNavPoint(-30, -45, 0x05d9e8); // Baliza 2
    addNavPoint(10, 115, 0xfcee0a);  // Baliza 3

    function frame() {
        requestAnimationFrame(frame);
        planetMesh.rotation.y += 0.0002;
        cloudMesh.rotation.y += 0.0004;
        spaceMesh.rotation.y += 0.00001;
        controls.update();
        renderer.render(scene, camera);
    }
    frame();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
