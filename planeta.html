<div id="info-panel">
    <h1>Aizinia</h1>
    <div class="stat"><span class="label">Clima:</span> <span style="color: #55ff55;">Apacible</span></div>
    <div class="stat"><span class="label">Centinelas:</span> <span style="color: #ffaa00;">Remoto</span></div>
    <div class="stat"><span class="label">Flora:</span> Generoso</div>
    <div class="stat"><span class="label">Fauna:</span> Abundante</div>
</div>

<div id="canvas-container"></div>

<!-- Estilos visuales incrustados -->
<style>
    body { margin: 0; overflow: hidden; background-color: #03030b; font-family: sans-serif; }
    #info-panel {
        position: absolute; top: 20px; left: 20px; background: rgba(5, 5, 20, 0.85);
        color: #7ef3ff; padding: 20px; border-radius: 8px; border: 1px solid #1a5f7a;
        pointer-events: none; text-transform: uppercase; letter-spacing: 1px; z-index: 10;
        box-shadow: 0 0 15px rgba(26, 95, 122, 0.4);
    }
    h1 { margin: 0 0 10px 0; font-size: 24px; color: #fff; text-shadow: 0 0 10px #7ef3ff; }
    .stat { margin: 5px 0; font-size: 13px; }
    .label { color: #888; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
</style>

<!-- Librerías de WebGL externas e hiper-compatibles -->
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

<script>
    // 1. ESCENARIO TRIDIMENSIONAL
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020208);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 2. SISTEMA DE LUZ ESTELAR
    const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
    sunLight.position.set(6, 4, 5);
    scene.add(sunLight);

    const spaceLight = new THREE.AmbientLight(0x2a3bb0, 0.6); // Resplandor cósmico azulado
    scene.add(spaceLight);

    // 3. MAQUETACIÓN DE AIZINIA
    const planetGroup = new THREE.Group();
    scene.add(planetGroup);

    // Renderizado procedural de bioma verde y mares azules
    function makeAiziniaTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#063970'; // Mares de color Azul solicitado
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1e6f3d'; // Continentes (Flora Generosa)
        for (let i = 0; i < 45; i++) {
            ctx.beginPath();
            let x = Math.random() * canvas.width;
            let y = Math.random() * canvas.height;
            let size = 35 + Math.random() * 90;
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }
        return new THREE.CanvasTexture(canvas);
    }

    const planetGeo = new THREE.SphereGeometry(1.5, 64, 64);
    const planetMat = new THREE.MeshStandardMaterial({
        map: makeAiziniaTexture(),
        roughness: 0.85,
        metalness: 0.05
    });
    const planetMesh = new THREE.Mesh(planetGeo, planetMat);
    planetGroup.add(planetMesh);

    // 4. ATMÓSFERA CLARA (Pocas nubes)
    function makeCloudTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; // Nubes ligeras
        for (let i = 0; i < 12; i++) {
            ctx.beginPath();
            let x = Math.random() * canvas.width;
            let y = Math.random() * canvas.height;
            let size = 20 + Math.random() * 35;
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }
        return new THREE.CanvasTexture(canvas);
    }

    const cloudGeo = new THREE.SphereGeometry(1.52, 64, 64);
    const cloudMat = new THREE.MeshStandardMaterial({
        map: makeCloudTexture(),
        transparent: true
    });
    const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
    planetGroup.add(cloudMesh);

    // 5. UBICACIÓN DE MARCADORES RELATIVOS
    function addNavPoint(lat, lon, colorHex) {
        const radius = 1.515; // Ligeramente despegado del suelo
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 180) * (Math.PI / 180);

        const x = -(radius * Math.sin(phi) * Math.sin(theta));
        const y = radius * Math.cos(phi);
        const z = radius * Math.sin(phi) * Math.cos(theta);

        // Geometría en forma de baliza/pin cónico de No Man's Sky
        const markerGeo = new THREE.ConeGeometry(0.04, 0.16, 6);
        markerGeo.rotateX(Math.PI / 2);
        
        const markerMat = new THREE.MeshBasicMaterial({ color: colorHex });
        const markerMesh = new THREE.Mesh(markerGeo, markerMat);
        
        markerMesh.position.set(x, y, z);
        markerMesh.lookAt(new THREE.Vector3(0, 0, 0)); 
        markerMesh.rotateX(Math.PI / 2);

        planetGroup.add(markerMesh);
    }

    // Registrando coordenadas de balizas espaciales
    addNavPoint(20, 30, 0xff2a6d);   // Estación Centinela (Rojo)
    addNavPoint(-40, -60, 0x05d9e8); // Depósito de Flora (Cian)
    addNavPoint(0, 150, 0xfcee0a);  // Puesto de Comercio (Amarillo)

    // 6. MOTOR DE RENDERIZADO Y ROTACIÓN
    function frame() {
        requestAnimationFrame(frame);

        // Rotación independiente para simular traslación climática
        planetMesh.rotation.y += 0.0008;
        cloudMesh.rotation.y += 0.0011; 

        controls.update();
        renderer.render(scene, camera);
    }

    frame();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
